# Game rules configuration - Day 4
# Keeps number ranges, ball counts, and source info out of code,
# per the "configuration over constants" engineering principle.

euromillions:
  source_url: "https://www.national-lottery.co.uk/results/euromillions/draw-details"
  main_numbers:
    count: 5
    min: 1
    max: 50
  bonus_numbers:
    name: "lucky_stars"
    count: 2
    min: 1
    max: 12
  date_format: "%a %d %b %Y"   # e.g. "Tue 21 Jul 2026"